<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Deploy Center</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/img/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151924;--line:#232838;--text:#e9ecf3;--muted:#9aa3b5;--accent:#4f7cff;--accent2:#8b5cf6}
@media (prefers-color-scheme: light){:root{color-scheme:light;--bg:#fbfbfd;--card:#fff;--line:#e3e5ec;--text:#14161c;--muted:#5d6475}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:20px}
img{width:72px;height:72px}
h1{font-size:36px;letter-spacing:-.02em;margin:18px 0 8px}
p{color:var(--muted);margin:0 0 28px}
a{color:var(--accent)}
.btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/icon-192.png" alt="" width="72" height="72">

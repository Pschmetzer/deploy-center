# Example: the daily deploy from GitHub Actions, without a Mac.
# Copy to .github/workflows/daily-deploy.yml in a repo of your own (a private "ops" repo is a good place).
# Not tested by the Deploy Center project yet: run it once by hand (workflow_dispatch) and check the log.
#
# Secrets to add in that repo (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN     a Vercel access token (vercel.com/account/tokens)
#   RENDER_API_KEY   a Render API key (leave it out if you use only Vercel)
#   GH_READ_TOKEN    a GitHub token that can read your app repos. The workflow's own GITHUB_TOKEN
#                    sees only this repo, and without gh nothing counts as changed.
# Variable (optional):
#   DEPLOYS_VERCEL_TEAM  your Vercel team id, if the token belongs to several teams
#
# Commit deploys-config/vercel-repos.json to this repo: copy it from ~/.config/deploys/ on the Mac
# where you turned auto-deploy off. It says which repo and branch each Vercel project deploys from.
#
# deploys comes from the release tarball (deploys plus providers/ and, in releases after 0.9.1,
# lib/ for team files, GitLab, simulate and ledger), checked against the release's checksums.txt.
# Update DEPLOYS_VERSION and VERCEL_CLI_VERSION by hand.
name: Daily deploy
on:
  schedule:
    - cron: "0 17 * * 1-5"   # 17:00 UTC, Monday to Friday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be deployed"
        type: boolean
        default: true
# The workflow token only reads this repo (the config). Deploys use the secrets above.
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: daily-deploy
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
      DEPLOYS_VERCEL_TEAM: ${{ vars.DEPLOYS_VERCEL_TEAM }}
      DEPLOYS_CONFIG: ${{ github.workspace }}/deploys-config
      DEPLOYS_VERSION: "0.9.1"        # pin a release; update it by hand
      VERCEL_CLI_VERSION: "65.12.1"   # pin the vercel CLI too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Vercel CLI
        run: npm install -g --no-fund --no-audit "vercel@${VERCEL_CLI_VERSION}"
      - name: Get deploys (release tarball, SHA-256 checked)
        run: |
          set -euo pipefail
          base="https://github.com/Pschmetzer/deploy-center/releases/download/v${DEPLOYS_VERSION}"
          file="deploys-cli-${DEPLOYS_VERSION}.tar.gz"
          mkdir -p "$RUNNER_TEMP/deploys-dl" && cd "$RUNNER_TEMP/deploys-dl"
          curl -fsSL "$base/$file" -o "$file"
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          # Only the tarball's line; no line at all fails too.
          awk -v f="$file" '$2 == f' checksums.txt | sha256sum -c -
          tar -xzf "$file"
          # deploys finds providers/ and lib/ next to itself.
          echo "$RUNNER_TEMP/deploys-dl/deploys-cli-${DEPLOYS_VERSION}" >> "$GITHUB_PATH"
      - name: What is connected
        run: deploys doctor
      - name: Deploy what changed
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            deploys deploy-changed
          else
            deploys deploy-changed --yes
          fi

# Example: dependency updates (Dependabot, Renovate) go live once a week, not every day.
# Copy to .github/workflows/ in the same repo as daily-deploy.yml, and add one step to that
# workflow before "Deploy what changed" (see examples/README.md):
#
#       - name: Hold back dependency-only updates
#         run: examples/bot-only.sh --hold
#
# Then a project that waits only for bot commits is left out of the daily deploy, and this
# workflow ships those projects every Monday. A project with any human commit goes out daily as
# before, with its dependency updates. Copy examples/bot-only.sh into the repo too.
#
# Secrets and variables: the same as daily-deploy.yml.
name: Weekly dependency updates
on:
  schedule:
    - cron: "0 9 * * 1"   # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be deployed"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-deploy   # never at the same time as the daily deploy
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
      DEPLOYS_VERCEL_TEAM: ${{ vars.DEPLOYS_VERCEL_TEAM }}
      DEPLOYS_CONFIG: ${{ github.workspace }}/deploys-config
      DEPLOYS_VERSION: "0.9.1"          # a release of Deploy Center; update it by hand
      VERCEL_CLI_VERSION: "65.12.1"     # the same pin as the Deploy Center action
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the Vercel CLI
        run: npm install -g --no-fund --no-audit "vercel@${VERCEL_CLI_VERSION}"
      - name: Get deploys (checked against checksums.txt)
        run: |
          base="https://github.com/Pschmetzer/deploy-center/releases/download/v${DEPLOYS_VERSION}"
          tarball="deploys-cli-${DEPLOYS_VERSION}.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o checksums.txt "$base/checksums.txt"
          sha256sum -c checksums.txt --ignore-missing --strict
          grep -q " ${tarball}\$" checksums.txt || { echo "::error::$tarball is not in checksums.txt"; exit 1; }
          tar -xzf "$tarball"
          echo "$PWD/deploys-cli-${DEPLOYS_VERSION}" >> "$GITHUB_PATH"
      # Only the projects that wait for bot commits alone: every other one goes to this run's
      # ignored.json, so deploy-changed leaves it out.
      - name: Keep only dependency-only projects
        run: examples/bot-only.sh --only
      - name: Deploy them
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            deploys deploy-changed
          else
            deploys deploy-changed --yes
          fi

# Example: when a PR is merged in your app's repo, comment what the next deploy would start and
# what it would cost (`deploys plan`, an estimate). Read-only: it never deploys. Auto-deploy is off,
# so a merge only makes a project wait; this comment says what waiting costs.
# Copy to .github/workflows/plan-pr-comment.yml in your app's repo, and examples/plan-comment.sh
# next to it as .github/plan-comment.sh (or fetch it from a pinned release).
#
# Secrets (Settings → Secrets and variables → Actions): VERCEL_TOKEN, RENDER_API_KEY (either one),
# GH_READ_TOKEN (a token that can read your app repos; GITHUB_TOKEN sees only this one).
# Variables (optional): DEPLOYS_VERCEL_TEAM, DEPLOYS_REPOS_JSON (the content of
# ~/.config/deploys/vercel-repos.json, for Vercel projects whose Git connection is off).
#
# Only merged PRs of this repo run it (a fork's PR gets no secrets). Never switch this to
# pull_request_target. Not run against real accounts by the project: merge a test PR and read the log.
name: Plan comment
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plan-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
      DEPLOYS_VERCEL_TEAM: ${{ vars.DEPLOYS_VERCEL_TEAM }}
      DEPLOYS_CONFIG: ${{ github.workspace }}/deploys-config
      DEPLOYS_VERSION: "0.16.0"        # pin a release; update it by hand
      VERCEL_CLI_VERSION: "65.12.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Vercel CLI
        run: npm install -g --no-fund --no-audit "vercel@${VERCEL_CLI_VERSION}"
      - name: Get deploys (release tarball, SHA-256 checked)
        run: |
          set -euo pipefail
          base="https://github.com/Pschmetzer/deploy-center/releases/download/v${DEPLOYS_VERSION}"
          file="deploys-cli-${DEPLOYS_VERSION}.tar.gz"
          mkdir -p "$RUNNER_TEMP/deploys-dl" && cd "$RUNNER_TEMP/deploys-dl"
          curl -fsSL "$base/$file" -o "$file"
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          awk -v f="$file" '$2 == f' checksums.txt | sha256sum -c -
          tar -xzf "$file"
          echo "$RUNNER_TEMP/deploys-dl/deploys-cli-${DEPLOYS_VERSION}" >> "$GITHUB_PATH"
      - name: Work out the plan and comment it
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The comment is written with the workflow token, the plan with GH_READ_TOKEN.
          COMMENT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # plan exits 1 when some project could not be read; the plan it printed still counts.
          deploys plan --json </dev/null > "$RUNNER_TEMP/plan.json" || true
          bash .github/plan-comment.sh < "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/comment.md"
          # Update the comment of an earlier run (found by its marker), else add one.
          export GH_TOKEN="$COMMENT_TOKEN"
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '[.[] | select(.body | startswith("<!-- deploy-center-plan -->")) | .id] | last // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi

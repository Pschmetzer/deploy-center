# Example only: copy to .github/workflows/ in your own repo and adjust.
#
# Deploys when a person writes [deploy] in the commit message, and only then. It deploys every
# project with changes that deploys can see, not only this repo's. Every other
# push just reports what is waiting. Note: GitHub shows only the newest commit of a push
# here (head_commit), so put the marker in the last commit you push.
name: deploy on [deploy]

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy everything with changes
        type: boolean
        default: false

permissions:
  contents: read

# Two quick pushes with [deploy] run one after the other, never side by side.
concurrency:
  group: deploy-on-marker
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Anyone who can push to main can write [deploy]. To have a reviewer approve each run, create
    # an environment "production" with required reviewers (Settings → Environments) and uncomment:
    # environment: production
    steps:
      # Pin to a release tag or a full commit SHA, not a branch.
      - uses: Pschmetzer/deploy-center/integrations/action@v0.9.1
        id: dc
        with:
          deploy: ${{ contains(github.event.head_commit.message, '[deploy]') || inputs.deploy == true }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team: ${{ vars.DEPLOYS_VERCEL_TEAM }}
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          repos-json: ${{ vars.DEPLOYS_REPOS_JSON }}

      - name: Report
        env:
          COUNT: ${{ steps.dc.outputs.count }}
          NAMES: ${{ steps.dc.outputs.names }}
          DEPLOYED: ${{ steps.dc.outputs.deployed }}
        run: echo "$COUNT with changes ($NAMES), deployed=$DEPLOYED"

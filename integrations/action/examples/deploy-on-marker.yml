# Example only: copy to .github/workflows/ in your own repo and adjust.
#
# Deploys when a person writes [deploy] in the commit message, and only then. It deploys the
# changed projects that deploy from this repo (set `repo: "*"` for every repo). Every other
# push just reports what is waiting. A squash merge puts the PR description into the commit
# message: whoever can open a PR can then write [deploy], so keep the `environment` below with
# required reviewers. Note: GitHub shows only the newest commit of a push
# here (head_commit), so put the marker in the last commit you push.
name: deploy on [deploy]

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this repo's projects that have changes
        type: boolean
        default: false

permissions:
  contents: read

# Two quick pushes with [deploy] must not run deploy-changed --yes twice at the same time.
# Queued, not cancelled: a run that started deploys finishes and reports.
concurrency:
  group: deploys-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Anyone who can push to main (or merge a PR) can write [deploy]. GitHub creates the environment
    # "production" on first use; add required reviewers (Settings → Environments) and every run waits
    # for a person's approval.
    environment: production
    steps:
      # Pin to a release tag or a full commit SHA, not a branch: this step holds your deploy tokens.
      # @main is only here because the `repo` input (default: this repo only) is newer than the
      # v0.9.1 tag. Replace it with the tag of the release that ships it.
      - uses: Pschmetzer/deploy-center/integrations/action@main
        id: dc
        with:
          deploy: ${{ contains(github.event.head_commit.message, '[deploy]') || inputs.deploy == true }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team: ${{ vars.DEPLOYS_VERCEL_TEAM }}
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          repos-json: ${{ vars.DEPLOYS_REPOS_JSON }}
          # Only projects that deploy from this repo are started (the default). "*" = every repo.
          # repo: ${{ github.repository }}

      - name: Report
        env:
          COUNT: ${{ steps.dc.outputs.count }}
          NAMES: ${{ steps.dc.outputs.names }}
          DEPLOYED: ${{ steps.dc.outputs.deployed }}
        run: echo "$COUNT with changes ($NAMES), deployed=$DEPLOYED"

name: deploy-center changed
description: >-
  Lists the Vercel and Render projects with commits that are not live yet (deploys changed --json).
  Deploys them only when the workflow says so with deploy: true.
author: Deploy Center
branding:
  icon: upload-cloud
  color: gray-dark

inputs:
  deploy:
    description: >-
      "true" starts a deploy of every project with changes (deploys deploy-changed --yes).
      "dry-run" writes the plan (what would be deployed) to the job summary and starts nothing.
      Anything else only reports. Default: only report.
    required: false
    default: "false"
  only:
    description: >-
      Comma-separated project names: only these count (and deploy). Empty: every project.
    required: false
    default: ""
  exclude:
    description: Comma-separated project names to leave out (also of deploy).
    required: false
    default: ""
  vercel-token:
    description: A Vercel access token (pass a secret). Empty skips Vercel (when no vercel CLI is on the runner).
    required: false
    default: ""
  vercel-team:
    description: The Vercel team id, if the projects belong to a team.
    required: false
    default: ""
  render-api-key:
    description: A Render API key (pass a secret). Empty skips Render.
    required: false
    default: ""
  github-token:
    description: Reads commits and pull requests of the projects' repos. Private repos need a token that can read them.
    required: false
    default: ${{ github.token }}
  repos-json:
    description: >-
      The content of vercel-repos.json (which repo and branch each Vercel project deploys from).
      Needed for Vercel projects whose Git connection was turned off: without it they never count as changed.
    required: false
    default: ""
  vercel-cli-version:
    description: The vercel CLI version to install when none is on the runner.
    required: false
    default: "65.12.1"

outputs:
  count:
    description: How many projects have changes.
    value: ${{ steps.changed.outputs.count }}
  names:
    description: Their names, comma-separated.
    value: ${{ steps.changed.outputs.names }}
  projects:
    description: The full JSON array, from deploys changed --json.
    value: ${{ steps.changed.outputs.projects }}
  started:
    description: How many deploys were started in this run.
    value: ${{ steps.deploy.outputs.started || '0' }}
  failed:
    description: How many failed to start (the step fails then).
    value: ${{ steps.deploy.outputs.failed || '0' }}
  deployed:
    description: '"true" when every deploy was started and every state could be read.'
    value: ${{ steps.deploy.outputs.deployed || 'false' }}

runs:
  using: composite
  steps:
    - name: Set up deploys
      id: setup
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_TEAM: ${{ inputs.vercel-team }}
        REPOS_JSON: ${{ inputs.repos-json }}
        CLI_VERSION: ${{ inputs.vercel-cli-version }}
      run: |
        set -euo pipefail
        cfg="$RUNNER_TEMP/deploys-config"; mkdir -p "$cfg"
        echo "DEPLOYS_CONFIG=$cfg" >> "$GITHUB_ENV"
        echo "DEPLOYS=$ACTION_PATH/../../deploys" >> "$GITHUB_ENV"
        echo "USER=${USER:-$(id -un)}" >> "$GITHUB_ENV"
        if [ -n "$REPOS_JSON" ]; then
          printf '%s' "$REPOS_JSON" | jq -e 'type == "object"' >/dev/null || { echo "::error::repos-json is not a JSON object"; exit 1; }
          printf '%s' "$REPOS_JSON" > "$cfg/vercel-repos.json"
        fi
        if [ -n "$VERCEL_TEAM" ]; then
          case "$VERCEL_TEAM" in *[!A-Za-z0-9_-]*) echo "::error::vercel-team must be a team id"; exit 1 ;; esac
          echo "DEPLOYS_VERCEL_TEAM=$VERCEL_TEAM" >> "$GITHUB_ENV"
        fi
        if [ -n "$VERCEL_TOKEN" ] && ! command -v vercel >/dev/null 2>&1; then
          case "$CLI_VERSION" in *[!0-9.]*|"") echo "::error::vercel-cli-version must be a version like 65.12.1"; exit 1 ;; esac
          # Into the runner's temp folder, not the global one (self-hosted runners may not allow it);
          # the log only when it fails.
          prefix="$RUNNER_TEMP/vercel-cli"
          if ! npm install --prefix "$prefix" --no-fund --no-audit "vercel@$CLI_VERSION" > "$RUNNER_TEMP/npm.log" 2>&1; then
            cat "$RUNNER_TEMP/npm.log"; echo "::error::could not install vercel@$CLI_VERSION"; exit 1
          fi
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
        fi

    - name: deploys changed --json
      id: changed
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        ONLY: ${{ inputs.only }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        # Exit 1 with a list: some project's state could not be read (named above, left out).
        rc=0; list="$("$DEPLOYS" changed --json </dev/null)" || rc=$?
        echo "$list" | jq -e 'type == "array"' >/dev/null 2>&1 || { echo "::error::deploys changed --json did not answer a list"; exit 1; }
        [ "$rc" = 0 ] || echo "::warning::deploys could not read every project; those are left out (see the log above)."
        # only / exclude: the projects left out go to ignored.json in this run's own config folder,
        # so deploy-changed leaves them out too.
        names() { printf '%s\n' "$1" | tr ', ' '\n' | sed '/^$/d'; }
        ONLY="${ONLY:-}" EXCLUDE="${EXCLUDE:-}"
        for n in $(names "$ONLY") $(names "$EXCLUDE"); do
          [[ "$n" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "::error::only/exclude: \"$n\" is not a project name"; exit 1; }
        done
        if [ -n "$ONLY$EXCLUDE" ]; then
          o="$(names "$ONLY" | jq -Rnc '[inputs]')"; x="$(names "$EXCLUDE" | jq -Rnc '[inputs]')"
          out="$(echo "$list" | jq -c --argjson o "$o" --argjson x "$x" 'map(.name) | map(select((($o | length) > 0 and (. as $n | $o | index($n) | not)) or (. as $n | $x | index($n))))')"
          echo "$out" > "$DEPLOYS_CONFIG/ignored.json"
          list="$(echo "$list" | jq -c --argjson ign "$out" 'map(select(.name as $n | $ign | index($n) | not))')"
        fi
        count="$(echo "$list" | jq length)"
        {
          echo "count=$count"
          echo "names=$(echo "$list" | jq -r 'map(.name) | join(",")')"
          d="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "projects<<$d"; echo "$list" | jq -c .; echo "$d"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### Projects with changes: $count"
          echo "$list" | jq -r '.[] | "- \(.platform) **\(.name)**: \(.pendingCommits // "?") commit(s) waiting"'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Plan (dry run)
      id: plan
      if: inputs.deploy == 'dry-run' && steps.changed.outputs.count != '0'
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Without --yes deploy-changed only shows the list; nothing starts.
        out="$("$DEPLOYS" deploy-changed </dev/null)" || true
        echo "$out"
        { echo "### Would deploy (dry run, nothing started)"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: deploys deploy-changed --yes
      id: deploy
      if: inputs.deploy == 'true' && steps.changed.outputs.count != '0'
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Exits 1 when a start failed or a state could not be read; the outputs are written first.
        rc=0; out="$("$DEPLOYS" deploy-changed --yes </dev/null)" || rc=$?
        echo "$out"
        # No summary line (an older CLI, or it stopped early): the outputs still get written.
        line="$(echo "$out" | grep -E '^[0-9]+ started, [0-9]+ failed to start' | tail -n 1 || true)"
        started="$(echo "$line" | sed -E 's/^([0-9]+) started.*/\1/')"; failed="$(echo "$line" | sed -E 's/.*, ([0-9]+) failed.*/\1/')"
        {
          echo "started=${started:-0}"; echo "failed=${failed:-0}"
          if [ "$rc" = 0 ]; then echo "deployed=true"; else echo "deployed=false"; fi
        } >> "$GITHUB_OUTPUT"
        exit "$rc"

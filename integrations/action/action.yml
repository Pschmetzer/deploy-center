name: deploy-center changed
description: >-
  Lists the Vercel and Render projects with commits that are not live yet (deploys changed --json).
  Deploys them only when the workflow says so with deploy: true.
author: Deploy Center
branding:
  icon: upload-cloud
  color: gray-dark

inputs:
  deploy:
    description: >-
      "true" starts a deploy of every project with changes that deploys from `repo`
      (deploys deploy-changed --yes). Anything else only reports. Default: only report.
    required: false
    default: "false"
  repo:
    description: >-
      With deploy: true, only projects that deploy from this repository are started
      (owner/name, or host/group/name for GitLab). Default: the repository running the workflow.
      "*" deploys every changed project the tokens can see, in every repo.
    required: false
    default: ${{ github.repository }}
  vercel-token:
    description: A Vercel access token (pass a secret). Empty skips Vercel (when no vercel CLI is on the runner).
    required: false
    default: ""
  vercel-team:
    description: The Vercel team id, if the projects belong to a team.
    required: false
    default: ""
  render-api-key:
    description: A Render API key (pass a secret). Empty skips Render.
    required: false
    default: ""
  github-token:
    description: Reads commits and pull requests of the projects' repos. Private repos need a token that can read them.
    required: false
    default: ${{ github.token }}
  repos-json:
    description: >-
      The content of vercel-repos.json (which repo and branch each Vercel project deploys from).
      Needed for Vercel projects whose Git connection was turned off: without it they never count as changed.
    required: false
    default: ""
  vercel-cli-version:
    description: The vercel CLI version to install when none is on the runner.
    required: false
    default: "65.12.1"

outputs:
  count:
    description: How many projects have changes.
    value: ${{ steps.changed.outputs.count }}
  names:
    description: Their names, comma-separated.
    value: ${{ steps.changed.outputs.names }}
  projects:
    description: The full JSON array, from deploys changed --json.
    value: ${{ steps.changed.outputs.projects }}
  started:
    description: How many deploys were started in this run.
    value: ${{ steps.deploy.outputs.started || '0' }}
  failed:
    description: How many failed to start (the step fails then).
    value: ${{ steps.deploy.outputs.failed || '0' }}
  deployed:
    description: '"true" when every deploy was started and every state could be read.'
    value: ${{ steps.deploy.outputs.deployed || 'false' }}

runs:
  using: composite
  steps:
    - name: Set up deploys
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_TEAM: ${{ inputs.vercel-team }}
        REPOS_JSON: ${{ inputs.repos-json }}
        CLI_VERSION: ${{ inputs.vercel-cli-version }}
      run: |
        set -euo pipefail
        cfg="$RUNNER_TEMP/deploys-config"; mkdir -p "$cfg"
        echo "DEPLOYS_CONFIG=$cfg" >> "$GITHUB_ENV"
        echo "DEPLOYS=$ACTION_PATH/../../deploys" >> "$GITHUB_ENV"
        echo "USER=${USER:-$(id -un)}" >> "$GITHUB_ENV"
        if [ -n "$REPOS_JSON" ]; then
          printf '%s' "$REPOS_JSON" | jq -e 'type == "object"' >/dev/null || { echo "::error::repos-json is not a JSON object"; exit 1; }
          printf '%s' "$REPOS_JSON" > "$cfg/vercel-repos.json"
        fi
        if [ -n "$VERCEL_TEAM" ]; then
          case "$VERCEL_TEAM" in *[!A-Za-z0-9_-]*) echo "::error::vercel-team must be a team id"; exit 1 ;; esac
          echo "DEPLOYS_VERCEL_TEAM=$VERCEL_TEAM" >> "$GITHUB_ENV"
        fi
        if [ -n "$VERCEL_TOKEN" ] && ! command -v vercel >/dev/null 2>&1; then
          case "$CLI_VERSION" in *[!0-9.]*|"") echo "::error::vercel-cli-version must be a version like 65.12.1"; exit 1 ;; esac
          npm install -g --no-fund --no-audit "vercel@$CLI_VERSION" >/dev/null
        fi

    - name: deploys changed --json
      id: changed
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Exit 1 with a list: some project's state could not be read (named above, left out).
        rc=0; list="$("$DEPLOYS" changed --json </dev/null)" || rc=$?
        echo "$list" | jq -e 'type == "array"' >/dev/null 2>&1 || { echo "::error::deploys changed --json did not answer a list"; exit 1; }
        [ "$rc" = 0 ] || echo "::warning::deploys could not read every project; those are left out (see the log above)."
        count="$(echo "$list" | jq length)"
        {
          echo "count=$count"
          echo "names=$(echo "$list" | jq -r 'map(.name) | join(",")')"
          d="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "projects<<$d"; echo "$list" | jq -c .; echo "$d"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### Projects with changes: $count"
          echo "$list" | jq -r '.[] | "- \(.platform) **\(.name)**: \(.pendingCommits // "?") commit(s) waiting"'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: deploys deploy-changed --yes
      id: deploy
      if: inputs.deploy == 'true' && steps.changed.outputs.count != '0'
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        # Only this repo's projects: every other project the tokens see goes into ignored.json of
        # this run's own config (in RUNNER_TEMP, gone after the job). Fails closed: when the list
        # cannot be read, or a name is in this repo and in another, nothing is started.
        if [ "$REPO" != "*" ]; then
          case "$REPO" in ''|*[!A-Za-z0-9._/-]*|/*|*/) echo "::error::repo must look like owner/name (or \"*\" for every repo), not \"$REPO\""; exit 1 ;; esac
          all="$("$DEPLOYS" list --json </dev/null)" || { echo "::error::deploys list --json failed, so this repo's projects are unknown. Nothing was started."; exit 1; }
          echo "$all" | jq -e 'type == "array"' >/dev/null 2>&1 || { echo "::error::deploys list --json did not answer a list. Nothing was started."; exit 1; }
          # .repo is owner/name for GitHub and host/group/name for GitLab; github.com/owner/name counts too.
          sel='(.repo // "" | ascii_downcase | sub("^github\\.com/"; "")) as $r | ($want | ascii_downcase | sub("^github\\.com/"; "")) as $w | $r != "" and $r == $w'
          mine="$(echo "$all" | jq -c --arg want "$REPO" "[.[] | select($sel) | .name] | unique")"
          other="$(echo "$all" | jq -c --arg want "$REPO" "[.[] | select(($sel) | not) | .name] | unique")"
          clash="$(jq -nr --argjson a "$mine" --argjson b "$other" '$a - ($a - $b) | join(", ")')"
          if [ -n "$clash" ]; then
            echo "::error::$clash is a name in $REPO and in another repo; deploying it here would start both. Nothing was started."; exit 1
          fi
          if [ "$mine" = "[]" ]; then
            echo "No project deploys from $REPO. Nothing was started. (Set repo: \"*\" for every repo.)"
            { echo "started=0"; echo "failed=0"; echo "deployed=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          ign="$DEPLOYS_CONFIG/ignored.json"; [ -s "$ign" ] || echo '[]' > "$ign"
          jq -c --argjson o "$other" '. + $o | unique' "$ign" > "$ign.new" && mv "$ign.new" "$ign"
          # What deploy-changed would start now, checked before it starts anything.
          plan="$("$DEPLOYS" deploy-changed --json </dev/null)" || true
          echo "$plan" | jq -e 'type == "array"' >/dev/null 2>&1 || { echo "::error::deploys deploy-changed --json did not answer a list, so what it would start is unknown. Nothing was started."; exit 1; }
          stray="$(echo "$plan" | jq -r --argjson m "$mine" '[.[] | .name | select(. as $n | $m | index($n) | not)] | join(", ")')"
          if [ -n "$stray" ]; then
            echo "::error::deploy-changed would also start projects outside $REPO ($stray). Nothing was started."; exit 1
          fi
          echo "Deploying only projects from $REPO: $(echo "$mine" | jq -r 'join(", ")')"
        fi
        # Exits 1 when a start failed or a state could not be read; the outputs are written first.
        # --json: one record per project ({platform, name, action, reason, id, url}), not a text line to parse.
        rc=0; out="$("$DEPLOYS" deploy-changed --yes --json </dev/null)" || rc=$?
        if echo "$out" | jq -e 'type == "array"' >/dev/null 2>&1; then
          echo "$out" | jq -r '.[] | "\(.platform)  \(.name)  \(.action)\(if .reason then ": \(.reason)" else "" end)\(if .url then " -> \(.url)" else "" end)"'
          started="$(echo "$out" | jq '[.[] | select(.action == "started")] | length')"
          failed="$(echo "$out" | jq '[.[] | select(.action == "failed")] | length')"
        else
          # Something may have started; the counts are unknown, so the step fails.
          echo "$out"; echo "::error::deploys deploy-changed --yes --json did not answer a list; what started is unknown."
          started=""; failed=""; rc=1
        fi
        {
          echo "started=${started:-0}"; echo "failed=${failed:-0}"
          if [ "$rc" = 0 ]; then echo "deployed=true"; else echo "deployed=false"; fi
        } >> "$GITHUB_OUTPUT"
        exit "$rc"

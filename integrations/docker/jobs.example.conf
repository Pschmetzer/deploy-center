# The schedule of the cron variant (Dockerfile.cron). Copy it to /config/jobs.conf. Times are UTC.
# One job per line: when, then optionally out=FILE, then the job. Words are split at spaces (no quotes or pipes).
# Only reading jobs: `deploys changed|status|plan|list|digest|notes|history|risk|doctor|explain|ledger|simulate|metrics|costs`,
# statuspage, badges, badge-stats, report. A line with --yes, or `deploys deploy`, is refused when the file is read.

# What waits to go live, as JSON in a file another tool reads (every 30 minutes, the first time at start).
every 30m out=/data/changed.json deploys changed --json

# The status page (needs /config/statuspage.json: integrations/statuspage/statuspage.example.json).
every 6h statuspage --config /config/statuspage.json --out /data/status

# Badges: one per project, and the three about the whole period (failure rate, saving, last deploy).
every 6h badges /data/badges
daily 06:10 badge-stats /data/badges --days 30

# The weekly report (Markdown and HTML) on Monday morning; a monthly one on the first look of a Sunday would be `weekly sun 08:00 report --period month`.
weekly mon 07:30 report --out /data/reports --period week

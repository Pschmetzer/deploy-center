# Example only: copy to .github/workflows/approve-deploy.yml in the repo you set as
# DEPLOYS_DIGEST_REPO, and adjust.
#
# Deploys the projects a person approved, and nothing else. Two ways to approve:
#   - Run workflow (the digest's button opens this page), projects: the list from the digest.
#   - Add the label deploy-approved to the digest issue "Deploys waiting – <date>".
# Only logins in the repository variable DEPLOYS_APPROVERS count. Bots never do.
# Each project is deployed at its branch head at the moment of approval.
name: approve deploy

on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to deploy, comma-separated, as the digest lists them ("all": everything waiting)'
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: approve-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'deploy-approved' && startsWith(github.event.issue.title, 'Deploys waiting – '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Who approved, and what
        id: approved
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          APPROVERS: ${{ vars.DEPLOYS_APPROVERS }}
          INPUT: ${{ inputs.projects }}
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          no() { echo "::error::$1"; echo "reason=$1" >> "$GITHUB_OUTPUT"; exit 1; }
          case "$SENDER_TYPE:$ACTOR" in Bot:*|*"[bot]") no "A bot cannot approve a deploy ($ACTOR)." ;; esac
          [ -n "$APPROVERS" ] || no "Set the repository variable DEPLOYS_APPROVERS (logins of the people who may approve)."
          printf '%s\n' "$APPROVERS" | tr ', ' '\n' | grep -qixF -- "$ACTOR" || no "$ACTOR is not in DEPLOYS_APPROVERS."
          if [ "$EVENT" = issues ]; then
            # Only today's digest (UTC): when a daily run failed, yesterday's issue would otherwise
            # still deploy whatever the branch head is now.
            [ "$TITLE" = "Deploys waiting – $(date -u +%Y-%m-%d)" ] || no "Only today's digest issue can be approved, not \"$TITLE\"."
            list="$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n 's/^<!-- deploys-approve: \(.*\) -->$/\1/p' | tail -n 1)"
          else
            list="$INPUT"
          fi
          list="$(printf '%s\n' "$list" | tr ', ' '\n' | sed '/^$/d' | sort -u)"
          [ -n "$list" ] || no "No projects named."
          if [ "$list" = all ]; then echo "projects=*" >> "$GITHUB_OUTPUT"; echo "Approved by $ACTOR: everything waiting."; exit 0; fi
          ! printf '%s\n' "$list" | grep -qvE '^[A-Za-z0-9._-]+$' || no "Project names may hold letters, digits, . _ - only."
          echo "projects=$(printf '%s\n' "$list" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "Approved by $ACTOR: $(printf '%s\n' "$list" | paste -sd, -)"

      # The list in the issue body must be the digest's own: anyone with triage rights can edit the
      # body after the approver read it. GitHub records who edited the body last; only the digest's
      # account (github-actions, or DEPLOYS_DIGEST_BOT when the digest runs with another token) may have.
      - name: The issue body is the digest's own
        id: body
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.issue.number }}
          BOT: ${{ vars.DEPLOYS_DIGEST_BOT || 'github-actions' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, not shell
          editor="$(gh api graphql -F owner="$OWNER" -F name="$REPO" -F number="$NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){editor{login}}}}' \
            --jq '.data.repository.issue.editor.login // ""')"
          case "$editor" in
            ""|"$BOT"|"${BOT}[bot]") echo "The body is the digest's (last edited by: ${editor:-nobody})." ;;
            *) echo "::error::The issue body was edited by $editor after the digest wrote it. Run the digest again, then approve."; exit 1 ;;
          esac

      # Pin to a release tag or a full commit SHA, not a branch. This first run only sets up
      # deploys (and the vercel CLI) for the next step; it asks nothing.
      - uses: Pschmetzer/deploy-center/integrations/action@v0.9.1
        id: list
        with:
          deploy: setup
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team: ${{ vars.DEPLOYS_VERCEL_TEAM }}
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          repos-json: ${{ vars.DEPLOYS_REPOS_JSON }}

      # Every project not approved is left out (deploys ignore), also one that changed since.
      - name: Leave out what was not approved
        id: keep
        env:
          PROJECTS: ${{ steps.approved.outputs.projects }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$PROJECTS" = "*" ] && { echo "Everything waiting was approved."; exit 0; }
          v='[]'; r='[]'
          if [ -n "$VERCEL_TOKEN" ]; then v="$("$DEPLOYS" vercel list --json </dev/null)"; fi
          if [ -n "$RENDER_API_KEY" ]; then r="$("$DEPLOYS" render list --json </dev/null)"; fi
          all="$(jq -n --argjson v "$v" --argjson r "$r" '$v + $r | map(.name) | unique')"
          want="$(printf '%s' "$PROJECTS" | jq -Rc 'split(",") | map(select(length > 0))')"
          ign="$DEPLOYS_CONFIG/ignored.json"; [ -f "$ign" ] || echo '[]' > "$ign"
          jq --argjson all "$all" --argjson want "$want" '. + ($all - $want) | unique' "$ign" > "$ign.t" && mv "$ign.t" "$ign"
          missing="$(jq -nr --argjson all "$all" --argjson want "$want" '$want - $all | join(", ")')"
          [ -z "$missing" ] || echo "::warning::Not found, so not deployed: $missing"
          echo "Deploying only: $(jq -nr --argjson all "$all" --argjson want "$want" '$want - ($want - $all) | join(", ")')"

      - uses: Pschmetzer/deploy-center/integrations/action@v0.9.1
        id: dc
        with:
          deploy: true
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-team: ${{ vars.DEPLOYS_VERCEL_TEAM }}
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          repos-json: ${{ vars.DEPLOYS_REPOS_JSON }}

      # What happened, on the run's page (both routes), and on the issue when it came from one.
      - name: Report
        id: report
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ steps.approved.outputs.reason }}
          NAMES: ${{ steps.dc.outputs.names }}
          STARTED: ${{ steps.dc.outputs.started }}
          FAILED: ${{ steps.dc.outputs.failed }}
          DEPLOYED: ${{ steps.dc.outputs.deployed }}
        run: |
          set -uo pipefail
          if [ -n "$REASON" ]; then msg="Not deployed: $REASON"
          elif [ -z "$STARTED" ]; then msg="Not deployed: the run stopped before deploying."
          elif [ "$STARTED" = 0 ] && [ "${FAILED:-0}" = 0 ]; then msg="Nothing to deploy: none of the approved projects has changes now."
          else msg="Started ${STARTED} deploy(s)${NAMES:+ ($NAMES)}, ${FAILED:-0} failed to start."; fi
          [ -z "${GITHUB_STEP_SUMMARY:-}" ] || { echo "### Approved deploy"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          [ "${EVENT:-}" = issues ] || exit 0
          gh issue comment "$ISSUE" -R "$REPO" --body "$msg [Run]($RUN_URL)"
          # The label is taken off: adding it again is a new approval.
          gh issue edit "$ISSUE" -R "$REPO" --remove-label deploy-approved
          [ "$DEPLOYED" = true ] && gh issue close "$ISSUE" -R "$REPO"
          exit 0

name: Idea or feature
description: Something Deploy Center should do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What do you want to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms?
      multiple: true
      options:
        - Vercel
        - Render
        - Netlify
        - Cloudflare Pages
        - AWS Amplify
        - DigitalOcean
        - Coolify
        - Deploy hook
        - GitHub
        - GitLab
        - Other
    validations:
      required: true

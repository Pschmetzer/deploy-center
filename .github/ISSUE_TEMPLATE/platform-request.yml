name: Platform request
description: Which platform should Deploy Center support next?
title: "Platform: "
labels: [platform-request]
body:
  - type: markdown
    attributes:
      value: |
        Today Deploy Center supports Vercel and Render, and as opt-in hosts Netlify, Cloudflare Pages,
        AWS Amplify, DigitalOcean App Platform, Coolify, Fly.io, Railway, Heroku, Firebase Hosting,
        GitHub Pages, Koyeb, Northflank, Deno Deploy and any deploy hook. Tell us which platform you want next.
        If an issue for your platform exists already, add a 👍 to it instead.
  - type: dropdown
    id: platform
    attributes:
      label: Which platform should Deploy Center support next?
      options:
        - Azure Static Web Apps
        - Kamal
        - Cloudflare Workers
        - Cloud Run
        - AWS App Runner
        - Dokploy
        - CapRover
        - Supabase
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: other
    attributes:
      label: Other platform
      description: Only if you picked "Other".
  - type: textarea
    id: use
    attributes:
      label: How do you deploy there today?
      description: For example auto-deploy on every push, a deploy hook, or a CLI.
    validations:
      required: true
  - type: textarea
    id: size
    attributes:
      label: How many projects or services do you have there? (optional)
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test a first version on my account.
        - label: I can help write the code.

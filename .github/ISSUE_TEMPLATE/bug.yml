name: Bug
description: Something shows wrong or does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The repo is public: replace project names, repos and domains with stand-ins (for example `my-app`, `example.com`).
        A count or cost that looks wrong has its own form, "A number looks wrong".
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open …
        2. Click …
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - App
        - deploys CLI
        - Menu bar
        - Update / install
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → "Copy diagnostics". It holds versions only, no names.
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The error
      description: Use "Copy the error" in the row, or paste the CLI output.
      render: text

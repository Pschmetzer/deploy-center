name: Website
# Publishes site/ to GitHub Pages. Only the website; the app is never deployed from here.
# site/docs/ is not in git: it is built here from the repo's Markdown and deploys --help, so it never drifts.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # sources of site/docs/
      - "README.md"
      - "deploys"
      - "docs/**/*.md"
      - "examples/README.md"
      - "integrations/**/*.md"
      - "scripts/build-docs.py"
      - "scripts/check-links.py"
      - "scripts/docs-assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # "Last updated" on each docs page comes from git log
      - name: Build docs
        run: python3 scripts/build-docs.py
      - name: Check links
        run: python3 scripts/check-links.py site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Tell search engines (Bing, Yandex, Seznam, Naver …) which URLs changed. Best effort only:
      # this step can fail or time out without failing the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        timeout-minutes: 2
        env:
          INDEXNOW_KEY: 4747785d1fcf908f9504c58a9a66de5a
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          body=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "deploycenter.app", key: $key, keyLocation: "https://deploycenter.app/\($key).txt", urlList: $urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body" || true)
          echo "IndexNow answered HTTP $code (200/202 = accepted)"

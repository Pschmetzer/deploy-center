name: CI
# Lint, tests and an unsigned build. Nothing here deploys or publishes anything, and no secrets are used.
on:
  push:
    branches: [main]
  pull_request:
  # Once a week, on main: a new runner image (Xcode, bash), a changed gh or vercel output or an expired pin
  # shows up here, not at the next unrelated pull request. The Website workflow publishes after a push only.
  schedule:
    - cron: "23 5 * * 1"
  # By hand (Actions tab, or `gh workflow run CI`): the same checks on any branch, e.g. after a runner image change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a push to main is never cancelled by the next one: every commit on main gets its checks
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # What needs no macOS: the personal-data and size checks. Fails fast and cheap. (shellcheck stays in the macOS job:
    # on a stock Ubuntu runner it was killed after about two minutes on the 300 KB `deploys`.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No personal data in the public repo
        run: scripts/check-public.sh
      - name: File sizes stay under their ceilings
        run: scripts/check-size.sh
      - name: Nothing bash 3.2 (macOS) does not have
        run: scripts/check-bash32.sh
      - name: shellcheck disables stay under their ceiling
        run: scripts/check-disables.sh
      - name: The CLI stays bash 3.2 compatible (no declare -A, mapfile, ${x,,} ...)
        run: python3 -I scripts/check-bash32.py
      - name: No secrets on command lines or in traces (curl -H, security -w, set -x)
        run: python3 -I scripts/check-secrets.py

  test:
    runs-on: macos-15
    # shellcheck and the script tests alone take 20-25 minutes on a slow runner; 30 cut the integration step off.
    timeout-minutes: 45
    env:
      # macOS minutes count tenfold: no brew self-update and no cleanup on every run.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 16.4
        # The image's default today, named so a new default does not change warnings or
        # type-checker timeouts without a commit here. If an image drops that exact folder, the
        # newest Xcode 16 on it is used instead of the job failing on a missing path.
        run: |
          x=/Applications/Xcode_16.4.app
          if [ ! -d "$x" ]; then for d in /Applications/Xcode_16*.app; do x="$d"; done; fi
          sudo xcode-select -s "$x"
      - name: Tools
        run: brew install jq shellcheck actionlint
      - name: actionlint (workflows and the example workflows people copy)
        run: actionlint .github/workflows/*.yml docs/deploy-on-label.yml examples/*.yml integrations/*/examples/*.yml
      - name: shellcheck (the same as scripts/lint.sh shellcheck)
        run: scripts/lint.sh shellcheck
      # check-public and check-size run in the lint job (Ubuntu): macOS minutes count tenfold.
      - name: Lint the example LaunchAgents and the icon script
        run: |
          plutil -lint scripts/*.plist.example
          swiftc -typecheck scripts/make-icon.swift
      - name: swift-format (advice only, never fails the run)
        # .swift-format holds the config. The count by rule goes to the run's summary; the code keeps its aligned columns
        # on purpose, so this is a hint for new code, not a gate.
        continue-on-error: true
        run: |
          xcrun swift-format lint --configuration .swift-format -r app shared 2> fmt.txt || true
          { echo "### swift-format"; echo; grep -o '\[[A-Za-z]*\]' fmt.txt | sort | uniq -c | sort -rn | head -15 | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$(grep -c 'warning:' fmt.txt) swift-format hints (see the run summary)"
      - name: Script tests
        run: bash tests/script-tests.sh
      - name: Team mode tests
        run: bash tests/team-tests.sh
      - name: Install tests (install.sh, release tarball, Homebrew formula)
        run: bash tests/install-tests.sh
      - name: Release tests (release gate, bump.sh, site checks, check-public, Homebrew cask)
        run: bash tests/release-tests.sh
      - name: Check script tests (bash 3.2 and secrets checks)
        run: bash tests/checks-tests.sh
      - name: Small CLI command tests (where, help, unknown command)
        run: bash tests/cli-misc-tests.sh
      - name: App tests (English and German, with the deploys JSON contract)
        run: bash tests/app-tests.sh
      - name: The "waiting" rule in deploys and in the iPhone app agree
        run: bash tests/ios-rule-tests.sh
      - name: Round 8 tests (masker and small commands)
        run: bash tests/round8-tests.sh
      - name: Round 9 tests (journal export and report)
        run: bash tests/round9-tests.sh
      - name: Round 12 tests (locks, time limits, hooks.d, risk rules)
        run: bash tests/round12-tests.sh
      - name: Round 10 tests (file modes, options, paging, hooks, traps, escapes)
        run: bash tests/welle10-tests.sh
      - name: CLI fixes tests (journal, launchd env, CI grace, request bodies)
        run: bash tests/cli-fixes-tests.sh
      - name: CLI parses with the bash macOS ships (3.2)
        run: |
          /bin/bash --version | head -n 1
          scripts/check-bash32.sh
      - name: CLI round 12 B tests (http, hooks, watch, verify, completion, release)
        run: bash tests/cli-r12b-tests.sh
      - name: Insights tests (timeline, recovery, when)
        run: bash tests/insights-tests.sh
      - name: Nightly check tests (new findings only, scan limit, leaks reported)
        run: bash tests/nightly-tests.sh
      - name: Bug hunt tests (regressions found by reading deploys and lib/)
        run: bash tests/bughunt-tests.sh
      - name: Speed tests (the list is printed as before the speed changes)
        run: bash tests/perf-tests.sh
      - name: Benchmark, 200 projects (reports only, never fails the build)
        continue-on-error: true
        run: bash scripts/bench.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            integrations/mcp/package-lock.json
            integrations/vscode/package-lock.json
      - name: Integration dependencies (MCP server, VS Code extension)
        run: |
          (cd integrations/mcp && npm ci --no-audit --no-fund)
          (cd integrations/vscode && npm ci --no-audit --no-fund)
      - name: npm audit (MCP server, bundled into the app)
        working-directory: integrations/mcp
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (VS Code extension, esbuild bundles its dependencies into the .vsix)
        working-directory: integrations/vscode
        run: npm audit --omit=dev --audit-level=high
      - name: Integration tests (MCP, Action, Claude Code plugin, digest, hooks)
        # REQUIRE_ALL=1: a part that cannot run here fails the job instead of being skipped.
        run: REQUIRE_ALL=1 bash integrations/tests/run.sh
      - name: Sparkle download (cached; scripts/sparkle.sh checks its SHA-256 either way)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: sparkle-${{ hashFiles('scripts/sparkle.sh') }}
      - name: Build with the widgets (ad-hoc signed, universal)
        run: ./build.sh --widgets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeployCenter-unsigned
          path: build/DeployCenter-*-universal.zip
          retention-days: 7

  ios:
    # The iPhone app and its widgets, built for the simulator without signing. Catches a change in
    # shared/ (PhoneLink, DeploySnapshot) that breaks the iOS build. Nothing is uploaded.
    runs-on: macos-26 # the iOS 26 SDK (BGContinuedProcessingTask in KeepAlive.swift)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: xcodebuild -version
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -project ios/DeployCenter.xcodeproj -scheme DeployCenter -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-dd CODE_SIGNING_ALLOWED=NO build -quiet
      - name: iPhone tests without a simulator (the log masking against the script's af_mask)
        run: bash ios/Tests/run.sh
      - name: iPhone logic tests (rule, API clients, snapshot, from made-up JSON)
        run: bash ios/test.sh
      - name: Smoke test on iPhone and iPad simulators (demo data, standard and largest text)
        # Reports only for now: a simulator that will not boot must not block a PR. Make it required once it has run green a few times.
        continue-on-error: true
        run: bash ios/smoke.sh build/ios-dd/Build/Products/Debug-iphonesimulator/DeployCenter.app
      - name: Smoke test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke
          path: build/ios-smoke
          if-no-files-found: ignore
          retention-days: 7

  linux-cli:
    # The CLI on Linux (GNU date/stat/sed, bash 5), as README, Docker image and Action promise.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          # jq, shellcheck, ruby and python3 come with the runner; `column` is in bsdextrautils.
          command -v column >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q bsdextrautils; }
          bash --version | head -1; jq --version
      - name: Script tests
        run: bash tests/script-tests.sh
      - name: Team mode tests
        run: bash tests/team-tests.sh
      - name: Release tests
        run: bash tests/release-tests.sh
      - name: Check script tests
        run: bash tests/checks-tests.sh
      - name: Small CLI command tests
        run: bash tests/cli-misc-tests.sh
      - name: The script's "waiting" rule against the shared cases
        run: bash tests/ios-rule-tests.sh
      - name: Round 8 tests
        run: bash tests/round8-tests.sh
      - name: Round 9 tests (journal export and report)
        run: bash tests/round9-tests.sh
      - name: Round 12 tests (locks, time limits, hooks.d, risk rules)
        run: bash tests/round12-tests.sh
      - name: Round 10 tests
        run: bash tests/welle10-tests.sh
      - name: CLI fixes tests
        run: bash tests/cli-fixes-tests.sh
      - name: CLI round 12 B tests
        run: bash tests/cli-r12b-tests.sh
      - name: Insights tests
        run: bash tests/insights-tests.sh
      - name: Nightly check tests
        run: bash tests/nightly-tests.sh
      - name: Bug hunt tests
        run: bash tests/bughunt-tests.sh
      - name: Speed tests
        run: bash tests/perf-tests.sh

  integrations:
    # integrations/tests/run.sh: Action, digest, statuspage, badge, notify, hooks, the Claude Code
    # plugin and the MCP server, against a stand-in deploys and curl. No network beyond npm ci.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            integrations/mcp/package-lock.json
            integrations/vscode/package-lock.json
      - name: Tools (column; xmllint for the badge and status page checks)
        run: |
          missing=()
          command -v column >/dev/null || missing+=(bsdextrautils)
          command -v xmllint >/dev/null || missing+=(libxml2-utils)
          if [ "${#missing[@]}" -gt 0 ]; then sudo apt-get update -q && sudo apt-get install -y -q "${missing[@]}"; fi
      - name: npm ci (MCP server, VS Code extension)
        run: |
          (cd integrations/mcp && npm ci --no-audit --no-fund)
          (cd integrations/vscode && npm ci --no-audit --no-fund)
      - name: Integration tests (on Linux, where the Action and the Docker image run)
        # REQUIRE_ALL=1: a part that cannot run here fails the job instead of being skipped.
        run: REQUIRE_ALL=1 bash integrations/tests/run.sh

  docker:
    # The Docker image builds from the repository root and the CLI inside finds its providers.
    # Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < integrations/docker/Dockerfile
      - name: Build
        run: docker build -f integrations/docker/Dockerfile -t deploys .
      - name: Build without the Vercel CLI (WITH_VERCEL=0)
        run: |
          docker build --build-arg WITH_VERCEL=0 -f integrations/docker/Dockerfile -t deploys-slim .
          docker run --rm deploys-slim --version
          docker run --rm --entrypoint bash deploys-slim -c '! command -v vercel'
      - name: deploys runs and finds its providers (no keys, no network)
        run: |
          docker run --rm deploys --version
          docker run --rm --entrypoint bash deploys -c 'deploys help >/dev/null && ls "$DEPLOYS_DIR/providers/vercel.sh"'

  cli-install:
    # The CLI's own install paths on Linux: install.sh under dash (Ubuntu's sh) and bash,
    # against a fake release folder. No network beyond the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh (POSIX sh, all severities)
        run: |
          shellcheck --severity=style site/install.sh
          shellcheck --severity=warning scripts/package-cli.sh scripts/homebrew-formula.sh tests/install-tests.sh
      - name: Install tests (dash)
        run: INSTALL_SH=dash bash tests/install-tests.sh
      - name: Install tests (bash as sh)
        run: INSTALL_SH=bash bash tests/install-tests.sh

  vscode:
    # The VS Code / Cursor extension: type check, unit tests against a stand-in deploys, and a
    # .vsix that builds. Nothing is published.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: The .vsix holds only what ships (an allowlist, so no sources, tests, source maps or node_modules)
        env:
          LC_ALL: C
        run: |
          unzip -Z1 deploy-center-*.vsix | sed '/\/$/d' | sort > "$RUNNER_TEMP/vsix.txt"
          printf '%s\n' '[Content_Types].xml' extension.vsixmanifest extension/LICENSE.txt extension/changelog.md \
            extension/dist/extension.js extension/l10n/bundle.l10n.de.json extension/media/icon.png extension/package.json \
            extension/package.nls.de.json extension/package.nls.json extension/readme.md | sort | diff - "$RUNNER_TEMP/vsix.txt" \
            || { echo "::error::the .vsix content changed: update this list on purpose (and .vscodeignore)"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploys-vscode
          path: integrations/vscode/*.vsix
          retention-days: 7

  raycast:
    # The Raycast extension: it builds (TypeScript checked), passes ESLint and Prettier, and its unit tests.
    # Not `ray lint`: it asks raycast.com whether the author has a store account (a network call
    # and an account matter, not a code check). Nothing is published.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (production dependencies; audit-allow.txt lists the reasoned exceptions)
        run: ./audit-gate.sh
      - name: Build (ray build, offline)
        run: npx --no-install ray build -e dist
      - name: ESLint
        run: npx --no-install eslint src test
      - name: Prettier
        run: npx --no-install prettier --check src test
      - name: Unit tests
        run: npm test

  docs:
    # site/docs/ is generated from the Markdown in this repo. Fails when the generator errors
    # (a link to a file that does not exist), when any link or #anchor in site/ is broken, or when
    # a page lacks its title, canonical or JSON-LD. fetch-depth 0 also brings the tags the release
    # gate needs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build docs
        run: python3 scripts/build-docs.py
      - name: Check links
        run: python3 scripts/check-links.py site
      - name: Check the site (titles, canonical, JSON-LD, sitemap, lang/alt/h1, image size, security.txt)
        run: python3 scripts/check-site.py
      - name: Every L(English, Deutsch) has both texts with the same values
        run: python3 -I scripts/check-strings.py
      - name: No visible text without an L(English, Deutsch) pair (brands are in scripts/export-strings-ignore.txt)
        run: python3 -I scripts/export-strings.py --check --strict
      - name: Release gate (VERSION, home page and appcast name the same release)
        run: python3 -I scripts/check-release.py
      - name: Docs agree (every page in docs/README.md, README.md and README.de.md alike, one h1, the man page is current)
        run: python3 -I scripts/check-docs.py
      - name: docs/CLI.md names every command of deploys help
        run: python3 -I scripts/check-cli-docs.py
      - name: ruff (syntax errors and pyflakes in scripts/*.py)
        run: pipx run ruff==0.16.7 check --isolated --select E9,F scripts/*.py

  public-commits:
    # Names and paths often land in commit messages, not in files: the same check as for the
    # tracked files, on every commit message of the pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No personal data in commit messages
        # bash: -eo pipefail, so a failing git log fails the step instead of checking nothing.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git log --format=%B "$BASE..HEAD" | scripts/check-public.sh --stdin

  changelog:
    # A change to the CLI, its providers and lib/, the integrations, the app, the iPhone app and widgets, the install script, the scripts or the docs should say so in CHANGELOG.md. A warning, not a failure:
    # the label "no-changelog" silences it.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CHANGELOG.md touched?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE"...HEAD)"
          if grep -qE '^(deploys|app/|providers/|lib/|integrations/|shared/|widgets/|ios/|scripts/|site/install\.sh|docs/)' <<<"$files" && ! grep -qx CHANGELOG.md <<<"$files"; then
            echo "::warning file=CHANGELOG.md::This PR changes something users see (deploys, providers/, lib/, integrations/, app/, shared/, widgets/, ios/, scripts/, docs/ or site/install.sh) but not CHANGELOG.md. Add a line under Unreleased, or the label no-changelog."
          fi

  external-links:
    # Once a week: every https link in the built site is asked once. Dead links to other sites (docs.vercel.com,
    # code.claude.com ...) change all the time and cannot be caught by a normal run, which never goes online.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build docs
        run: python3 scripts/build-docs.py
      - name: Ask every external link
        run: python3 scripts/check-links.py --external site

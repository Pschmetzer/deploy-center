name: CI
# Lint, tests and an unsigned build. Nothing here deploys or publishes anything, and no secrets are used.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: brew install jq shellcheck actionlint
      - name: No personal data in the public repo
        run: scripts/check-public.sh
      - name: actionlint
        run: actionlint .github/workflows/*.yml docs/deploy-on-label.yml
      - name: shellcheck
        run: |
          shellcheck --severity=warning deploys providers/*.sh build.sh release.sh scripts/*.sh tests/*.sh tests/lib/*.sh tests/providers/*.sh lib/*.sh
          shellcheck site/install.sh
      - name: Script tests
        run: bash tests/script-tests.sh
      - name: Team mode tests
        run: bash tests/team-tests.sh
      - name: Install tests (install.sh, release tarball, Homebrew formula)
        run: bash tests/install-tests.sh
      - name: App tests
        run: bash tests/app-tests.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Integration dependencies (MCP server, VS Code extension)
        run: |
          (cd integrations/mcp && npm ci --no-audit --no-fund)
          (cd integrations/vscode && npm ci --no-audit --no-fund)
      - name: Integration tests (MCP, Action, Claude Code plugin, digest, hooks)
        # REQUIRE_ALL=1: a part that cannot run here fails the job instead of being skipped.
        run: REQUIRE_ALL=1 bash integrations/tests/run.sh
      - name: Build (ad-hoc signed, universal)
        run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeployCenter-unsigned
          path: build/DeployCenter-*-universal.zip
          retention-days: 7

  cli-install:
    # The CLI's own install paths on Linux: install.sh under dash (Ubuntu's sh) and bash,
    # against a fake release folder. No network beyond the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh (POSIX sh, all severities)
        run: |
          shellcheck site/install.sh
          shellcheck --severity=warning scripts/package-cli.sh scripts/homebrew-formula.sh tests/install-tests.sh
      - name: Install tests (dash)
        run: INSTALL_SH=dash bash tests/install-tests.sh
      - name: Install tests (bash as sh)
        run: INSTALL_SH=bash bash tests/install-tests.sh

  vscode:
    # The VS Code / Cursor extension: type check, unit tests against a stand-in deploys, and a
    # .vsix that builds. Nothing is published.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

  docs:
    # site/docs/ is generated from the Markdown in this repo. Fails when the generator errors
    # (a link to a file that does not exist) or when any link or #anchor in site/ is broken.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build docs
        run: python3 scripts/build-docs.py
      - name: Check links
        run: python3 scripts/check-links.py site

  changelog:
    # A change to the CLI or the app should say so in CHANGELOG.md. A warning, not a failure:
    # the label "no-changelog" silences it.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CHANGELOG.md touched?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE"...HEAD)"
          if grep -qE '^(deploys|app/)' <<<"$files" && ! grep -qx CHANGELOG.md <<<"$files"; then
            echo "::warning file=CHANGELOG.md::This PR changes deploys or app/ but not CHANGELOG.md. Add a line under Unreleased, or the label no-changelog."
          fi

# Weekly PRs for the pinned GitHub Actions (by commit SHA), the npm dependencies of the
# integrations and the Docker base image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /integrations/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /integrations/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /integrations/raycast
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /integrations/docker
    schedule:
      interval: weekly
    # Node's odd releases (23, 25, …) are never long-term supported: only LTS bases are proposed.
    ignore:
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x"]
